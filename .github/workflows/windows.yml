name: Windows release and fixture checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smbFixture:
        description: Exercise a disposable Windows loopback share
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./tools/package.ps1 -Benchmark
      - shell: pwsh
        run: |
          python -m pip install imageio-ffmpeg==0.6.0 mutagen==1.47.0
          python tools/tag_fixtures.py
      - if: github.event_name == 'workflow_dispatch' && inputs.smbFixture
        shell: pwsh
        run: ./tools/test-smb.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CrateDeck-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.json
            artifacts/screenshots/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CrateDeck-win-x64
          path: distribution
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" distribution/CrateDeck-win-x64.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mixamp build ${GITHUB_RUN_NUMBER}" --generate-notes
