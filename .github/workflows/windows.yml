name: Desktop builds and releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smbFixture:
        description: Exercise a disposable Windows loopback share
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: ./tools/package.ps1 -Benchmark
      - shell: pwsh
        run: |
          python -m pip install imageio-ffmpeg==0.6.0 mutagen==1.47.0
          python tools/tag_fixtures.py
      - if: github.event_name == 'workflow_dispatch' && inputs.smbFixture
        shell: pwsh
        run: ./tools/test-smb.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Mixamp-Windows
          path: artifacts/Mixamp-win-x64.zip
  macos:
    uses: ./.github/workflows/macos.yml
  release:
    needs: [package, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Mixamp-*
          path: dist
          merge-multiple: true
      - name: Publish the desktop packages for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Directory.Build.props").findtext("./PropertyGroup/Version"))')
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "v$version" dist/Mixamp-win-x64.zip dist/Mixamp-osx-arm64.zip dist/Mixamp-osx-x64.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mixamp $version" --generate-notes
