<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixamp</title><link rel="stylesheet" href="app.css"><script defer src="app.js"></script></head><body>
<div id="classicTitle"><span>M I X A M P</span></div><header><div class="transport"><button id="prev" aria-label="Previous track">◀</button><button id="play" aria-label="Play" title="Play (Space)">▶</button><button id="next" aria-label="Next track">▶▏</button></div><div class="deck"><strong id="now">Ready to play</strong><span id="by"></span><canvas id="bars" width="208" height="36"></canvas><time id="clock">0:00</time><input id="seek" type="range" min="0" value="0" aria-label="Playback position"></div><label>Volume<input id="volume" type="range" min="0" max="1" step=".01" value=".7"></label></header>
<div class="body"><aside><div class="brand"><img src="mixtape.png" alt="">Mixamp</div><button id="songs" class="nav active">♫　Songs</button><button id="radio" class="nav">◉　Radio</button><button id="queue" class="nav">☰　Up Next</button><details id="folders"><summary>Playlists</summary><div id="lists"></div></details></aside>
<main><div class="toolbar"><button id="queueBack" hidden>‹ All stations</button><h1 id="heading">Songs</h1><input id="search" type="search" placeholder="Search tracks" aria-label="Search tracks"><button id="library">Library ▾</button><button id="edit">Edit ▾</button><button id="view" aria-haspopup="true" disabled>View ▾</button><button id="eq">EQ ▾</button></div>
<section id="radioPane" hidden aria-label="Radio stations"></section><div id="grid" tabindex="0" aria-label="Tracks"><div id="head"></div><div id="spacer"><div id="rows"></div></div></div></main></div>
<footer><span id="status">Ready</span><span id="progress"></span></footer><div id="menu" hidden></div>
<dialog id="review"><h2></h2><div id="reviewBody"></div><div class="actions"><button id="cancel">Cancel</button><button id="confirm">Continue</button></div></dialog><audio id="audio" preload="metadata"></audio></body></html>
